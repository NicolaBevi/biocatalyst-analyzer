[project]
name = "biocatalyst-analyzer"
version = "0.1.0"
description = "Report di due diligence multi-agente su aziende biotech/pharma NASDAQ/NYSE, focalizzati su catalizzatori clinici e regolatori a breve termine."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "streamlit>=1.38",
    "httpx>=0.27",
    "tenacity>=8.5",
    "structlog>=24.4",
    "yfinance>=1.6.0",
    "diskcache>=5.6",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
    "ollama>=0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "vcrpy>=6.0",
]

[project.scripts]
biocatalyst = "biocatalyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biocatalyst"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["biocatalyst"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "diskcache.*", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=biocatalyst --cov-report=term-missing"
