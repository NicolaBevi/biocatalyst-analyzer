[project]
name = "biocatalyst-analyzer"
version = "0.1.0"
description = "Report di due diligence multi-agente su aziende biotech/pharma NASDAQ/NYSE, focalizzati su catalizzatori clinici e regolatori a breve termine."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "typer>=0.12",
    "streamlit>=1.38",
    "httpx>=0.27",
    "tenacity>=9,<10",
    "structlog>=24.4",
    "yfinance>=1.6.0,<2",
    "diskcache>=5.6",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    # I tetti di major sono deliberati: ognuno di questi SDK ha cambiato API in
    # modo incompatibile tra major. In particolare anthropic 0.x ha una
    # superficie diversa da 1.x (temperature accettato, Text Completions
    # presenti), quindi un vincolo ">=0.40" installerebbe codice incompatibile.
    "anthropic>=1,<2",
    "openai>=3,<4",
    "google-genai>=2,<3",
    "ollama>=0.6,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "vcrpy>=6.0",
    # Importato dai test per costruire le eccezioni degli SDK: anthropic e
    # openai tipizzano le loro eccezioni su httpx2, non su httpx.
    "httpx2>=2",
    "respx>=0.23.1",
]

[project.scripts]
biocatalyst = "biocatalyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biocatalyst"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["biocatalyst"]

# python_version è disaccoppiato da requires-python: i .pyi di numpy 2.x
# (dipendenza transitiva di streamlit/yfinance) usano sintassi PEP 695 che il
# parser di mypy rifiuta sotto 3.12, anche per stub non importati direttamente
# dal nostro codice. Il codice sorgente resta comunque compatibile 3.11+:
# questo valore serve solo a mypy per interpretare gli stub installati.
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "diskcache.*", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=biocatalyst --cov-report=term-missing"
markers = [
    "rate_limiter_reale: esclude il test dalla fixture che azzera i rate limiter",
]
